project:
  type: website
  # GitHub Pages is configured (Settings -> Pages) as "Deploy from a branch:
  # main, /docs" -- the legacy Pages build, which serves whatever static
  # files are committed at /docs on main directly, with no build step of its
  # own. So the rendered site's output-dir has to *be* the repo's top-level
  # docs/ folder, not a build artifact under docs-src/. Render here with
  # `quarto render docs-src` and commit the resulting docs/ folder.
  output-dir: ../docs
  pre-render:
    - "bash copy-images.sh"
  resources:
    - .nojekyll

website:
  title: "Quarto Conference Posters"
  description: "Print + web conference poster templates built with Quarto and Typst."
  site-url: https://au-datascience.github.io/poster_templates/
  repo-url: https://github.com/AU-datascience/poster_templates
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: templates.qmd
        text: Templates
      - href: content-guide.qmd
        text: Content Guide
      - href: theming.qmd
        text: Theming & Brand
      - href: scripts-and-ci.qmd
        text: Scripts & CI
      - href: why-typst.qmd
        text: Why Typst
    right:
      - icon: github
        href: https://github.com/AU-datascience/poster_templates
        text: GitHub

format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    link-external-icon: true
    link-external-newwindow: true
