# Continuous integration for the Quarto poster templates.
#
# IMPORTANT: this workflow is inert until the project is actually a git
# repository hosted on GitHub. At the time it was added, `git rev-parse` found
# no repository in this tree, so nothing has ever executed it.
#
# Placement assumes quarto_posters/ is the repository root, which is what the
# README's "Code & data" link implies. If you instead commit the parent folder,
# move this file to <repo-root>/.github/workflows/ and add:
#
#   defaults:
#     run:
#       working-directory: quarto_posters
#
# scripts/templates.R (and everything that sources it) resolves the project
# root with here::here() rather than requiring the runner's cwd to already be
# that root -- but here::here() still has to find *something* to anchor on
# (a `.here` file, `_quarto.yml`, or `.git`) by searching upward from cwd. The
# checked-out repo root ships a `.here` file for exactly this reason. If you
# move this workflow per the note above without also setting
# `working-directory: quarto_posters`, here::here() will walk up from the
# actual repo root, find the *parent's* .git first, and resolve the wrong
# directory -- scripts/templates.R then fails fast with a clear "no .qmd
# file / no templates/ directory" error rather than silently using the wrong
# path, but the fix is still to set `working-directory: quarto_posters`.
#
# The two jobs are deliberately separate. The contrast audit is pure source
# parsing -- no Quarto, no fonts, no rendering -- so it is fast and gives an
# unambiguous answer. The render job depends on the Typst toolchain and on font
# availability, which are the fragile parts; isolating them means an
# accessibility regression is never confused with a rendering environment
# problem.

name: posters

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Cheap pre-check: does this diff touch anything check-contrast.R actually
  # reads, or anything render-all.R actually renders/checks? Both downstream
  # jobs pay for a from-source tidyverse install (setup-r-dependencies, no
  # cache) regardless of what changed -- 30-40 minutes has been observed for
  # the contrast job alone -- and the render job additionally pays for the
  # full Quarto/Typst toolchain. Skipping either job entirely when its inputs
  # are untouched (e.g. a docs-src/-only or README-only commit) is a bigger
  # win than anything inside the jobs themselves. workflow_dispatch always
  # runs both jobs in full regardless of the filters, since there's no
  # meaningful "diff" for a manual run.
  #
  # A job skipped via `if:` reports as "skipped", which GitHub treats as
  # passing for required-status-check purposes -- so this is safe to use even
  # if these jobs are required checks on main.
  changes:
    name: Detect which jobs this diff requires
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    outputs:
      colors: ${{ steps.filter.outputs.colors }}
      render: ${{ steps.filter.outputs.render }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            colors:
              - '_brand.yml'
              - 'scss/**'
              - 'templates/*/poster.qmd'
              - 'templates/*/*.scss'
              - 'scripts/templates.R'
              - 'scripts/check-contrast.R'
              - '_extensions/quarto-ext/poster/**'
            render:
              - '_brand.yml'
              - '_quarto.yml'
              - '.quarto-version'
              - 'scss/**'
              - 'templates/**'
              - 'scripts/**'
              - '_extensions/**'
              - '.github/workflows/posters.yml'

  contrast:
    name: WCAG AAA contrast audit
    needs: changes
    # `always()` so this still runs on workflow_dispatch, where `changes` is
    # itself skipped (its own `if:` excludes that event) and its output would
    # otherwise short-circuit this condition to false.
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.colors == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::here

      # Every audited pair currently reaches AAA, so the strict gate is the
      # meaningful one: any color edit that drops a pair to AA fails the build.
      # Drop the flag to enforce only AA.
      - name: Audit color contrast
        run: Rscript scripts/check-contrast.R --require-aaa

  render:
    name: Render posters and check output
    needs: changes
    # Same `always()` reasoning as the `contrast` job above: `changes` is
    # skipped outright on workflow_dispatch, so its output must not be what
    # gates this condition in that case.
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.render == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The unpinned `release` default previously installed whatever Quarto
      # was newest per run; a recent release picked up a pandoc/typst-writer
      # change that inserts a stray leading backslash into the
      # institution-logo path substituted into typst-show.typ
      # ($institution-logo$), which Typst then rejects ("path must not
      # contain a backslash") -- not reproducible locally, since local Quarto
      # stayed on 1.9.38. The pinned version lives in the single file
      # `.quarto-version` (read below) rather than being duplicated across
      # workflows, so posters.yml and docs.yml can never drift out of sync
      # with each other. Bump `.quarto-version` deliberately -- run
      # `make check-quarto-version` after installing the new release locally
      # and re-render before pushing the bump -- rather than letting CI
      # silently drift to a new release.
      - name: Read pinned Quarto version
        id: quarto-version
        run: echo "version=$(cat .quarto-version)" >> "$GITHUB_OUTPUT"

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ steps.quarto-version.outputs.version }}

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # pak resolves system dependencies from this list, which matters for
          # pdftools (poppler) and magick (ImageMagick).
          packages: |
            any::tidyverse
            any::here
            any::pdftools
            any::magick
            any::palmerpenguins
            any::patchwork
            any::broom
            any::knitr

      # poster.typ sets `font: "STIX Two Text"`, and the Typst show rule
      # Quarto injects for headings uses "Source Sans 3" (both now declared
      # as brand font resources in _brand.yml, `source: google`). Quarto
      # fetches both from Google and caches them under
      # .quarto/typst/fonts/ at render time, so the runner needs no system
      # fonts for Typst at all -- CI and local renders resolve the same
      # face by construction, rather than depending on whatever happens to
      # be installed locally (see AGENTS.md's former "Fonts -- unresolved"
      # note for how this was diagnosed and fixed).

      - name: Render all templates and run output checks
        run: Rscript scripts/render-all.R

      # Useful for eyeballing a regression: the checks report numbers, but the
      # PDFs show what actually changed.
      - name: Upload rendered posters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-posters
          path: |
            templates/*/poster.pdf
            templates/*/poster.html
          if-no-files-found: warn
