# Publishes docs/ (a nested Quarto website project -- see docs/_quarto.yml)
# to the gh-pages branch, for GitHub Pages.
#
# This is independent of .github/workflows/posters.yml: that workflow renders
# the poster templates themselves, this one renders and deploys the
# documentation site describing them. Separated so a docs typo can't fail
# the poster-rendering checks and vice versa.
#
# One-time manual step after this first runs: in the repo's Settings ->
# Pages, set "Build and deployment: Source" to "Deploy from a branch" and
# pick the `gh-pages` branch (root). `quarto publish` creates that branch
# itself on first run; it does not exist beforehand.

name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Render and publish docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Kept in sync with the version pinned in posters.yml -- see the
          # note there about unpinned `release` drift breaking renders.
          version: "1.9.38"

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
