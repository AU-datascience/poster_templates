# Build-check only -- NOT a deploy step.
#
# GitHub Pages (Settings -> Pages) is configured as "Deploy from a branch:
# main, /docs": the legacy Pages build serves whatever static files are
# committed at /docs directly, with no build step of its own. So the actual
# "deploy" is just committing a fresh `quarto render docs-src` output to
# /docs on main -- there is nothing for CI to publish.
#
# What this job does instead: renders docs-src/ on every push/PR that
# touches it, purely to catch a broken doc page before merge. It does not
# commit or push anything. If you change docs-src/, remember to also
# re-render and commit /docs before merging:
#
#   quarto render docs-src

name: docs-build-check

on:
  push:
    branches: [main]
    paths:
      - "docs-src/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs-src/**"
  workflow_dispatch:

jobs:
  build:
    name: Render docs-src (sanity check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Kept in sync with the version pinned in posters.yml -- see the
          # note there about unpinned `release` drift breaking renders.
          version: "1.9.38"

      - name: Render docs-src
        run: quarto render docs-src
