# Build-check + drift-check -- NOT a deploy step.
#
# GitHub Pages (Settings -> Pages) is configured as "Deploy from a branch:
# main, /docs": the legacy Pages build serves whatever static files are
# committed at /docs directly, with no build step of its own. So the actual
# "deploy" is just committing a fresh `quarto render docs-src` output to
# /docs on main -- there is nothing for CI to publish.
#
# What this job does instead:
#   1. Renders docs-src/ fresh, to catch a broken doc page before merge.
#   2. Diffs the *content* of that fresh render (docs/search.json and
#      docs/images/, not the full site -- see the step below for why) against
#      what's already committed at /docs in this branch/PR. If they differ,
#      someone edited docs-src/ (or one of the images copy-images.sh pulls
#      in) without re-running `quarto render docs-src` and committing the
#      result -- exactly the failure mode this check exists to catch, since
#      a stale /docs is invisible in the PR diff otherwise (docs-src/*.qmd
#      changes review fine on their own; nothing forces /docs to be
#      re-rendered to match).
# It does not commit or push anything either way.

name: docs-build-check

on:
  push:
    branches: [main]
    paths:
      - "docs-src/**"
      - "images/**"
      - "comparison.png"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs-src/**"
      - "images/**"
      - "comparison.png"
  workflow_dispatch:

jobs:
  build:
    name: Render docs-src and check /docs is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the same `.quarto-version` file as posters.yml, so the two
      # workflows can't drift apart -- see the note there about unpinned
      # `release` drift breaking renders.
      - name: Read pinned Quarto version
        id: quarto-version
        run: echo "version=$(cat .quarto-version)" >> "$GITHUB_OUTPUT"

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ steps.quarto-version.outputs.version }}

      - name: Render docs-src
        run: quarto render docs-src

      - name: Check /docs images match a fresh render
        run: |
          # docs/images/ is a plain byte-for-byte copy (see copy-images.sh),
          # so comparing it is fully deterministic and catches a forgotten
          # preview update, unlike the HTML/search.json checks below.
          if ! git diff --exit-code -- docs/images; then
            echo "::error::docs/images/ is stale relative to the images copy-images.sh pulls in. Run \`quarto render docs-src\` locally and commit the result."
            exit 1
          fi

      - name: Check /docs content matches a fresh render
        # Not a full `git diff -- docs`: Quarto's bundled Bootstrap CSS gets
        # a *different* content hash on Linux (this runner) than on macOS
        # (where these are normally rendered and committed) from
        # byte-identical source and the same pinned Quarto version -- e.g.
        # bootstrap-158031...css locally vs. bootstrap-a547dd1...css here.
        # That's Sass-compiler cross-platform nondeterminism, and it touches
        # every page's <head>, so a full-HTML diff fails on every run
        # regardless of content changes. docs/search.json -- the full
        # extracted text of every page, used for site search -- is a much
        # better proxy (derived from content, not the CSS/JS toolchain), but
        # even its *entry order* isn't stable across platforms, so
        # .github/scripts/check-docs-search-json.py compares it sorted by
        # objectID rather than as raw text.
        run: python3 .github/scripts/check-docs-search-json.py
